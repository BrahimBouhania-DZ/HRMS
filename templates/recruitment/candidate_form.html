{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "مرشح" %} — {{ APP_NAME }}{% endblock %}
{% block content %}
<h1>{% trans "إضافة مرشح" %}</h1>
<form method="post" class="form-card" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="toolbar">
        <button class="btn btn-primary" type="submit">{% trans "حفظ" %}</button>
        <a class="btn" href="{% url 'recruitment:candidate_list' %}">{% trans "إلغاء" %}</a>
    </div>
</form>
{% endblock %}
