{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "دورة تدريبية" %} — {{ APP_NAME }}{% endblock %}
{% block content %}
<h1>{% if object %}{% trans "تعديل الدورة" %}{% else %}{% trans "دورة جديدة" %}{% endif %}</h1>
<form method="post" class="form">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">{% trans "حفظ" %}</button>
    <a class="btn" href="{% url 'training:course_list' %}">{% trans "إلغاء" %}</a>
</form>
{% endblock %}
