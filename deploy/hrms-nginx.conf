# =====================================================================
# HRMS — مثال Nginx (وكيل عكسي + ملفات ثابتة)
# التثبيت:
#   sudo cp deploy/hrms-nginx.conf /etc/nginx/sites-available/hrms
#   sudo ln -s /etc/nginx/sites-available/hrms /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# =====================================================================
server {
    listen 80;
    server_name hrms.local 192.168.1.10;

    client_max_body_size 10M;

    # الملفات الثابتة المجمّعة (تُولَّد عبر manage.py collectstatic)
    location /static/ {
        alias /opt/hrms/staticfiles/;
        expires 30d;
    }

    # وسائط رفع الموظفين
    location /media/ {
        alias /opt/hrms/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

